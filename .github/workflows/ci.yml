name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python source
        run: python -m py_compile awus_surveyor.py

      - name: Run unit and orchestration tests
        run: python -m unittest -v tests/test_parser.py

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n run_awus_surveyor.sh
          bash -n scripts/package-release.sh

      - name: Check release metadata
        run: |
          grep -q 'VERSION = "1.0.1"' awus_surveyor.py
          grep -q '^# AWUS1900 Surveyor v1.0.1' README.md
